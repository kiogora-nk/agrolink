services:
  - type: web
    name: agrolink
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: SITE_URL
        sync: false
      # Attach agrolink-db to this service in the Render dashboard (Database ->
      # Connect), which injects DATABASE_URL automatically. Or set it manually
      # to the database's Internal Database URL.
      - key: DATABASE_URL
        sync: false
      # Optional: enables image-based disease detection
      - key: CROP_VISION_API_KEY
        sync: false
      - key: CROP_VISION_MODEL
        sync: false
