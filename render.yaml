services:
  - type: web
    name: agrolink
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: SITE_URL
        sync: false
      # The app's database. Current setup: Neon Postgres (https://neon.tech).
      # Paste the POOLED connection string from the Neon dashboard (the host
      # contains "-pooler") as the value here, e.g.
      #   postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/neondb?sslmode=require
      # To copy existing data over, run:  python migrate_to_neon.py
      # (set NEON_DATABASE_URL first - see the header of that script).
      - key: DATABASE_URL
        sync: false
      # --- Email (Gmail SMTP) ---
      # Without these set in the Render dashboard, ALL email silently fails
      # (the app fails soft and only logs). MAIL_PASSWORD is a 16-char
      # Google App Password, not the Gmail login password.
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: CHIEF_ADMIN_EMAIL
        sync: false
      # Optional: enables image-based disease detection
      - key: CROP_VISION_API_KEY
        sync: false
      - key: CROP_VISION_MODEL
        sync: false
