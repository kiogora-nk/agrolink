{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-8">
    <div class="w-full max-w-md bg-white p-6 sm:p-10 rounded-2xl shadow-xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-amber-800">Join {{ company_name }}</h2>
            <p class="text-gray-500 mt-2">Create your free account and start trading</p>
        </div>
        <form method="POST" action="/register" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <input type="text" name="username" placeholder="Choose a username"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" required>
            </div>
            <div>
                <input type="email" name="email" placeholder="Your email address"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" required>
            </div>
            <div>
                <input type="tel" name="phone" placeholder="Phone number (e.g. 0712 345 678)"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                <p class="mt-1 text-xs text-gray-500">Required — we call this number to arrange your orders.</p>
            </div>
            <div class="relative">
                <input type="password" name="password" id="password" placeholder="Password"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500" onclick="togglePassword('password')" aria-label="Show password">
                    <svg id="password-eye-on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <svg id="password-eye-off" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" hidden>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                    </svg>
                </button>
            </div>
            <div class="relative">
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500" onclick="togglePassword('confirm_password')" aria-label="Show password">
                    <svg id="confirm_password-eye-on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <svg id="confirm_password-eye-off" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" hidden>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                    </svg>
                </button>
            </div>
            <div>
                <select name="role" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <option value="buyer">I want to buy produce</option>
                    <option value="farmer">I am a farmer / seller</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-amber-600 text-white py-3 rounded-lg font-semibold hover:bg-amber-700 transition">
                Create Account
            </button>
        </form>
        <p class="mt-6 text-center text-sm text-gray-600">
            Already have an account? <a href="/login" class="text-amber-700 font-semibold hover:underline">Log in</a>
        </p>
    </div>
</div>
<script>
function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    const eyeOn = document.getElementById(fieldId + '-eye-on');
    const eyeOff = document.getElementById(fieldId + '-eye-off');
    const button = eyeOn.closest('button');
    if (field.type === "password") {
        field.type = "text";
        eyeOn.hidden = true;
        eyeOff.hidden = false;
        button.setAttribute('aria-label', 'Hide password');
    } else {
        field.type = "password";
        eyeOn.hidden = false;
        eyeOff.hidden = true;
        button.setAttribute('aria-label', 'Show password');
    }
}
</script>
{% endblock %}
