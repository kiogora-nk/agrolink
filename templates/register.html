{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-10 rounded-2xl shadow-xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-green-800">Join Market2Farm</h2>
            <p class="text-gray-500 mt-2">Create your free account and start trading</p>
        </div>
        <form method="POST" action="/register" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <input type="text" name="username" placeholder="Choose a username" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
            </div>
            <div>
                <input type="email" name="email" placeholder="Your email address" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
            </div>
            <div>
                <input type="text" name="phone" placeholder="Phone number (optional)" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div class="relative">
                <input type="password" name="password" id="password" placeholder="Password" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm text-gray-500" onclick="togglePassword('password')">
                    👁️
                </button>
            </div>
            <div class="relative">
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm text-gray-500" onclick="togglePassword('confirm_password')">
                    👁️
                </button>
            </div>
            <div>
                <select name="role" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="buyer">I want to buy produce</option>
                    <option value="farmer">I am a farmer / seller</option>
                </select>
            </div>
            <div class="bg-gray-100 p-4 rounded-lg">
                <label class="block text-sm font-medium mb-2">Security check: <span class="font-mono text-lg">{{ captcha_question }}</span> = ?</label>
                <input type="text" name="captcha_answer" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                <input type="hidden" name="captcha_id" value="{{ captcha_id }}">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                Create Account
            </button>
        </form>
        <p class="mt-6 text-center text-sm text-gray-600">
            Already have an account? <a href="/login" class="text-green-600 font-semibold hover:underline">Log in</a>
        </p>
    </div>
</div>
<script>
function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
    } else {
        field.type = "password";
    }
}
</script>
{% endblock %}
