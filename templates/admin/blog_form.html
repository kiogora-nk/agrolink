{% extends "base.html" %}
{% block title %}{{ 'Edit' if post else 'New' }} Post{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-slate-900">{{ 'Edit Post' if post else 'New Post' }}</h1>
        <a href="{{ url_for('admin_blog') }}" class="rounded border border-amber-700 px-4 py-2 text-sm font-semibold text-amber-800">Back to Blog</a>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-4 rounded bg-white p-6 shadow-sm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div>
            <label class="block text-sm font-medium text-slate-700">Title</label>
            <input name="title" required value="{{ post.title if post else '' }}" class="w-full rounded border p-2 focus:ring-2 focus:ring-amber-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700">Body</label>
            <textarea name="body" rows="10" class="w-full rounded border p-2 focus:ring-2 focus:ring-amber-500">{{ post.body if post else '' }}</textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700">Cover image upload</label>
            <input type="file" name="image" accept="image/*" class="w-full rounded border p-2">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">or Image URL</label>
            <input name="image_url" value="{{ post.image if post and post.image and post.image.startswith('http') else '' }}" class="w-full rounded border p-2 focus:ring-2 focus:ring-amber-500" placeholder="https://...">
        </div>

        <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="checkbox" name="published" {% if not post or post.published %}checked{% endif %}> Published
        </label>

        <button type="submit" class="rounded bg-amber-600 px-6 py-3 font-semibold text-white hover:bg-amber-700">
            {{ 'Save Changes' if post else 'Create Post' }}
        </button>
    </form>
</div>
{% endblock %}
