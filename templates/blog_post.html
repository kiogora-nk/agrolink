{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<article class="max-w-3xl mx-auto">
    <a href="{{ url_for('blog') }}" class="text-sm font-semibold text-amber-800 underline">&larr; Back to Blog</a>
    <h1 class="mt-3 text-3xl font-bold text-slate-900">{{ post.title }}</h1>
    <p class="mt-1 text-sm text-slate-500">{{ post.created_at.strftime('%b %d, %Y') }}{% if post.author %} · {{ post.author.username }}{% endif %}</p>

    {% if post.image %}
    <img src="{{ post.image }}" alt="{{ post.title }}" class="mt-5 w-full rounded object-cover">
    {% endif %}

    <div class="prose mt-6 max-w-none whitespace-pre-line text-slate-700">{{ post.body }}</div>
</article>
{% endblock %}
