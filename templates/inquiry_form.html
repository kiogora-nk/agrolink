{% extends "base.html" %}
{% block title %}Ask Admin about {{ product.name }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">Inquiry about {{ product.name }}</h2>
    <p class="text-gray-600 mb-4">Your question will be sent to the platform admin. You will receive a reply in your notifications.</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <textarea name="message" rows="5" class="w-full border rounded p-3" placeholder="Write your question here... (Note: phone numbers, emails, and external links will be automatically removed)" required></textarea>
        <div class="mt-4 flex flex-col gap-3 sm:flex-row">
            <button type="submit" class="w-full sm:w-auto bg-amber-600 text-white px-6 py-3 rounded">Send Inquiry</button>
            <a href="{{ url_for('product_detail', id=product.id) }}" class="w-full sm:w-auto text-center bg-gray-300 text-gray-800 px-6 py-3 rounded">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
