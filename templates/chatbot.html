{% extends "base.html" %}
{% block title %}AI Chatbot{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">AI Assistant (full page)</h2>
<div id="chat-log" class="bg-white h-[60vh] sm:h-96 overflow-y-scroll p-4 mb-4 border rounded"></div>
<div class="flex">
    <input id="user-input" class="flex-grow min-w-0 p-2 border rounded-l" placeholder="Ask me anything...">
    <button onclick="sendMessage()" class="shrink-0 min-h-[44px] bg-amber-600 text-white px-4 rounded-r">Send</button>
</div>
<script src="/static/js/chatbot.js"></script>
{% endblock %}
