{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold text-center text-green-800 mb-6">Reset Password</h2>
        <p class="text-gray-600 text-center mb-6">Enter your email address and we will send you a link to reset your password.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="mb-4">
                <input type="email" name="email" placeholder="Your email address" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                Send Reset Link
            </button>
        </form>
        <div class="mt-4 text-center">
            <a href="/login" class="text-sm text-green-600 hover:underline">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
