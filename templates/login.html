{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-10 rounded-2xl shadow-xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-green-800">Welcome Back</h2>
            <p class="text-gray-500 mt-2">Log in to your Market2Farm account</p>
        </div>
        <form method="POST" action="/login" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <input type="text" name="username" placeholder="Username or Email" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
            </div>
            <div class="relative">
                <input type="password" name="password" id="password" placeholder="Password" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500" onclick="togglePassword()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                </button>
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                Log In
            </button>
        </form>
        <div class="mt-4 text-center">
            <a href="/forgot-password" class="text-sm text-green-600 hover:underline">Forgot password?</a>
        </div>
        <div class="mt-6 text-center text-sm text-gray-600">
            Or sign in with
        </div>
        <div class="flex justify-center space-x-4 mt-3">
            <a href="/api/auth/google" class="bg-red-100 hover:bg-red-200 p-2 rounded-full transition">
                <svg class="w-6 h-6 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.85 3.28-1.84 4.24-1.2 1.16-3.06 1.94-6 1.94-4.56 0-8.25-3.7-8.25-8.25S7.92 3.88 12.48 3.88c2.25 0 4.14.82 5.66 2.16l2.53-2.53C18.83 1.66 15.87.5 12.48.5 6.22.5.92 5.8.92 12s5.3 11.5 11.56 11.5c3.4 0 6.34-1.14 8.45-3.14 2.24-2.1 3.53-5.07 3.53-9.45 0-.7-.06-1.4-.17-2.08H12.48z"/></svg>
            </a>
            <a href="/api/auth/facebook" class="bg-blue-100 hover:bg-blue-200 p-2 rounded-full transition">
                <svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/></svg>
            </a>
        </div>
        <p class="mt-6 text-center text-sm text-gray-600">
            Don't have an account? <a href="/register" class="text-green-600 font-semibold hover:underline">Sign up</a>
        </p>
    </div>
</div>
<script>
function togglePassword() {
    const field = document.getElementById('password');
    if (field.type === "password") {
        field.type = "text";
    } else {
        field.type = "password";
    }
}
</script>
{% endblock %}
