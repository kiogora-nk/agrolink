{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <h2 class="mb-1 text-2xl font-bold text-slate-900">Add New Product</h2>
    <p class="mb-4 text-sm text-slate-600">
        {% if is_admin %}Your product will be published immediately.{% else %}Your product will be reviewed by an admin before it goes live.{% endif %}
    </p>
    <form method="POST" enctype="multipart/form-data" class="space-y-3 rounded bg-white p-6 shadow-sm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input name="name" placeholder="Product Name" class="w-full rounded border p-2" required>
        <textarea name="description" placeholder="Description" rows="3" class="w-full rounded border p-2"></textarea>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input name="price" type="number" step="0.01" min="0" placeholder="Price (KES)" class="w-full rounded border p-2" required>
            <input name="stock" type="number" min="0" placeholder="Stock" value="0" class="w-full rounded border p-2">
        </div>
        <select name="category" class="w-full rounded border p-2">
            {% for c in categories %}
            <option value="{{ c }}">{{ c|capitalize }}</option>
            {% endfor %}
        </select>
        <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="checkbox" name="organic"> Organic
        </label>
        <input type="file" name="image" accept="image/*" class="w-full rounded border p-2">
        <input name="image_url" placeholder="or Image URL (https://...)" class="w-full rounded border p-2">
        <button type="submit" class="rounded bg-amber-600 px-4 py-2 font-semibold text-white hover:bg-amber-700">
            {% if is_admin %}Publish Product{% else %}Submit for Review{% endif %}
        </button>
    </form>
</div>
{% endblock %}
